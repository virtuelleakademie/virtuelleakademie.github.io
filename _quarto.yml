project:
  type: website
  output-dir: docs
  preview:
    port: 8803
    browser: true

license: "CC BY-SA 4.0"

website:
  title: "Virtuelle Akademie | AI in Teaching"
  description: "Research and resources on AI in higher education"

  site-url: https://virtuelleakademie.github.io/
  repo-url: https://github.com/virtuelleakademie/virtuelleakademie.github.io
  repo-actions: [edit, issue]

  favicon: /assets/va-logo.png
  open-graph: true
  reader-mode: false
  page-navigation: true
  back-to-top-navigation: true

  search:
    location: navbar
    type: overlay

  navbar:
    background: light
    left:
      - text: "Blog"
        href: posts/index.qmd
      - text: "Teaching"
        href: teaching/index.qmd
      - text: "Research"
        href: research/index.qmd

    right:
      - about/index.qmd

    tools:
      - icon: github
        href: https://github.com/virtuelleakademie
        target: _blank

page-footer:
  left: "(c) 2026 Virtuelle Akademie | [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)"
  right:
    - icon: github
      href: https://github.com/virtuelleakademie
      target: _blank
    - icon: inbox-fill
      href: mailto:virtuelle.akademie@bfh.ch
      target: _blank

format:
  html:
    theme:
      light:
        - simplex
        - styles/custom.scss
    toc: true
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true
    linkcolor: "#9A4665"

execute:
  cache: true
  freeze: auto
  execute-dir: project

editor:
  render-on-save: true

comments:
  hypothesis:
    theme: clean
