project:
  type: website
  output-dir: docs
  preview:
    port: 8803
    browser: true
  render: 
    - index.qmd
    - research/**/*.qmd
    - teaching/**/*.ipynb
    - research/**/*.ipynb
    - teaching/**/*.qmd
    - workshops/**/*.qmd
    - about/**/*.qmd
    - posts/**/*.qmd

website:
  title: "Virtuelle Akademie"

  site-url: https://virtuelleakademie.github.io/
  repo-url: https://github.com/virtuelleakademie
  # repo-actions: [edit, issue]

  favicon: /assets/va-logo.png
  open-graph: true
  reader-mode: false
  page-navigation: true
  back-to-top-navigation: true

  search:
    location: navbar
    type: overlay

  navbar:
    background: light
    left:
      - text: "Research"
        href: research/
        id: research
      - text: "Teaching"
        href: teaching/
        id: teaching
      - text: "Workshops"
        href: workshops/
        id: workshops

    right:
      - text: "About"
        href: about/
      
    tools:
      - icon: lightbulb-fill
        text: Knowledge Base
        href: https://virtuelleakademie.ch/knowledge-base/
        target: _blank
      - icon: github
        href: https://github.com/virtuelleakademie
        target: _blank

  sidebar:
    - id: research
      title: "Research"
      href: research/
      style: "docked"
      search: true
      background: light
      contents:
        - research/index.qmd
    - id: teaching
      title: "Teaching"
      href: teaching/
      style: "docked"
      search: true
      background: light
      contents:
        - teaching/index.qmd
        - text: "BFH Weiterbildung"
          href: teaching/bfh-weiterbildung/
        - text: "CAS Hochschuldidaktik"
          href: teaching/cas-hochschuldidaktik/
    - id: workshops
      title: "Workshops"
      href: workshops/
      style: "docked"
      search: true
      background: light
      contents:
        - workshops/index.qmd
        - text: "Special Topics"
          href: workshops/special-topics/
        - text: "Bespoke Workshops"
          href: workshops/bespoke/

page-footer:
  left: "© 2025 Virtuelle Akademie"
  right:
    - icon: github
      href: https://github.com/virtuelleakademie
      target: _blank
    - icon: inbox-fill
      href: mailto:virtuelle.akademie@bfh.ch
      target: _blank

format:
  html:
    theme:
      light:
        - simplex
        - styles/custom.scss
    toc: true
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true
    linkcolor: "#000000"
    # include-after-body:
    #   - navbar-active.js

execute:
  cache: true
  freeze: auto
  execute-dir: project

editor:
  render-on-save: true

comments:
  hypothesis:
    theme: clean

revealjs-plugins:
  - attribution

filters:
  - timer
  - custom-callout

custom-callout:
  active-processing:
    icon-symbol: "📝"
    collapse: false
    color: "#333333"
